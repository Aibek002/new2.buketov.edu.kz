version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new2-buketov-web
    volumes:
      - ./:/var/www/html/
    networks:
      - new2-buketov-network
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./:/var/www/html/
    depends_on:
      - web
    networks:
      - new2-buketov-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: new2-buketov-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new2-buketov-network
  db:
    image: mysql:8.0
    container_name: new2-buketov-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: new_buketov_edu_kz
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new2-buketov-network
networks:
  new2-buketov-network:
    driver: bridge